
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "economy-exe"
version = "0.1.0"
description = "An open-source agent-based economic civilization simulator"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
